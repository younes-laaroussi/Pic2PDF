<style>.t{font-size:17px;font-weight:600;fill:#1f2937}.s{font-size:13px;fill:#4b5563}</style>
<rect width="1070" height="305" fill="#fff"/><rect x="30" y="30" width="200" height="70" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="130.0" y="62.0" text-anchor="middle" class="t">Photo</text><text x="130.0" y="83.0" text-anchor="middle" class="s">camera or library</text><rect x="290" y="30" width="200" height="70" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="390.0" y="62.0" text-anchor="middle" class="t">Resize</text><text x="390.0" y="83.0" text-anchor="middle" class="s">Accelerate / vImage</text><rect x="550" y="30" width="200" height="70" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/><text x="650.0" y="62.0" text-anchor="middle" class="t">Vision encoder</text><text x="650.0" y="83.0" text-anchor="middle" class="s">Gemma 3n, GPU (Metal)</text><rect x="810" y="30" width="230" height="70" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/><text x="925.0" y="62.0" text-anchor="middle" class="t">Language model</text><text x="925.0" y="83.0" text-anchor="middle" class="s">INT4, CPU, SME2 or NEON</text><line x1="230" y1="65" x2="288" y2="65" stroke="#555" stroke-width="2.5" marker-end="url(#a)" /><line x1="490" y1="65" x2="548" y2="65" stroke="#555" stroke-width="2.5" marker-end="url(#a)" /><line x1="750" y1="65" x2="808" y2="65" stroke="#555" stroke-width="2.5" marker-end="url(#a)" /><rect x="810" y="170" width="230" height="70" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="925.0" y="202.0" text-anchor="middle" class="t">Streaming LaTeX</text><text x="925.0" y="223.0" text-anchor="middle" class="s">token by token</text><rect x="550" y="170" width="200" height="70" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="650.0" y="202.0" text-anchor="middle" class="t">Validate + auto-fix</text><text x="650.0" y="223.0" text-anchor="middle" class="s">latex.js, KaTeX</text><rect x="290" y="170" width="200" height="70" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><t