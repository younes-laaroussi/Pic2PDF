<rect width="1150" height="285" fill="#fff"/><rect x="20" y="50" width="210" height="80" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/><text x="125.0" y="87.0" text-anchor="middle" class="t">MediaPipe 0.10.24</text><text x="125.0" y="108.0" text-anchor="middle" class="s">SME2 kernels built in, switch off</text><rect x="290" y="50" width="230" height="80" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="405.0" y="87.0" text-anchor="middle" class="t">XNNPACK</text><text x="405.0" y="108.0" text-anchor="middle" class="s">reads the switch at first use</text><rect x="590" y="10" width="220" height="70" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="700.0" y="42.0" text-anchor="middle" class="t">Switch off (shipped)</text><text x="700.0" y="63.0" text-anchor="middle" class="s">NEON kernels</text><rect x="590" y="100" width="220" height="70" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/><text x="700.0" y="132.0" text-anchor="middle" class="t">Switch on (this app)</text><text x="700.0" y="153.0" text-anchor="middle" class="s">KleidiAI SME2 kernels</text><rect x="880" y="10" width="250" height="70" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/><text x="1005.0" y="42.0" text-anchor="middle" class="t">Baseline</text><text x="1005.0" y="63.0" text-anchor="middle" class="s">first token 5.0 s, 10.1 tok/s</text><rect x="880" y="100" width="250" height="70" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/><text x="1005.0" y="132.0" text-anchor="middle" class="t">With SME2</text><text x="1005.0" y="153.0" text-anchor="middle" class="s">first token 3.0 s, 11.0 tok/s</text><line x1="230" y1="90" x2="288" y2="90" stroke="#555" stroke-width="2.5" marker-end="url(#a)" /><line x1="520" y1="75" x2="588" y2="50" stroke="#555" stroke-width="2.5" marker-end="url(#a)" /><line x1="520" y1="105" x2="588" y2="130" stroke="#555" stroke-width="2.5" marker-end="url(#a)" /><line x1="810" y1="45" x2="878" y2="45" stroke="#555" stroke-width="2.5" marker-end="url(#a)" /><line x1="810" y1="135" x2="878" y2="135" stroke="#555" stroke-width="2.5" marker-end="url(#a)" /><rect x="20" y="200" width="500" height="60" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/><text x="270.0" y="227.0" text-anchor="middle" class="t">App flips the switch once at launch</text><text x="270.0" y="248.0" text-anchor="middle" class="s">before XNNPACK starts, only if the chip reports SME2</text><line x1="405" y1="200" x2="405" y2="132" stroke="#555" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="6 4"/></svg>